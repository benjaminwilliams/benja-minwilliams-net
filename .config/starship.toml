[username]
show_always = true
format = "[$user]($style)@"

[directory]
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
repo_root_style = "underline bright-cyan"

[time]
disabled = false

[aws]
symbol = "  "

[buf]
symbol = " "

[c]
symbol = " "

[character]
success_symbol = "[\\(✿◠‿◠\\)](bold green)"
error_symbol = "[\\(ง •̀_•́\\)ง](bold red)"

[conda]
symbol = " "

[dart]
symbol = " "

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[git_branch]
symbol = " "

[golang]
symbol = " "

[haskell]
symbol = " "

[hg_branch]
symbol = " "

[hostname]
ssh_only = false
disabled = false
format = "[$ssh_symbol$hostname]($style) "


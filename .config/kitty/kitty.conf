# BEGIN_KITTY_THEME
# Gruvbox Dark
#include ./frappe.conf
#include ./tokyo-night-kitty.conf
#include ./kitty-gruvbox-theme/gruvbox_light_hard.conf
include ./longmacc.conf

# END_KITTY_THEME
background_opacity 0.5
hide_window_decorations no
font_family       DejaVuSansM Nerd Font Mono 
bold_font         auto
italic_font       auto

# keymap for crkbd
map ctrl+m neighboring_window left
map ctrl+n neighboring_window down
map ctrl+i neighboring_window right
map ctrl+e neighboring_window up

map ctrl+shift+m move_window left
map ctrl+shift+n move_window down
map ctrl+shift+i move_window right
map ctrl+shift+e move_window up

map ctrl+tab nth_window -1

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}-{title}"
bold_italic_font  auto
